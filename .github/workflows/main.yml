name: Build Sweet Coop Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - - name: Accept Android SDK licenses
  run: yes | sdkmanager --licenses || true

- name: Install Android platform
  run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
        

      - name: Unpack project
        run: unzip -q Sweet_Coop_Candy_Shop_Android_Project.zip -d project

      - name: Build APK
        working-directory: project/SweetCoopAndroid
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: sweet-coop-candy-shop-apk
          path: project/SweetCoopAndroid/app/build/outputs/apk/debug/app-debug.apk
          
